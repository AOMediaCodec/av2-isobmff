name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build specification
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/specbuild/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/specbuild/package-lock.json

      - name: Install Python dependencies
        run: pip install -r tools/specbuild/requirements.txt

      - name: Install Node dependencies
        run: npm ci
        working-directory: tools/specbuild

      - name: Install WeasyPrint system libraries
        run: sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Build specification
        run: python tools/specbuild/compile.py --profile publication

      - name: Prepare Pages artifact
        run: |
          mkdir dist
          cp -r av2-isobmff_Spec/. dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
