name: Check PR
on:
    pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  main:
    name: Run checks for specification
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for potential future diff support

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build specification (PR branch)
        run: |
            bikeshed --version
            bikeshed spec
            cp index.html pr_index.html

      - name: Build specification (main branch)
        run: |
          # Save current branch/commit
          PR_REF=$(git rev-parse HEAD)

          # Checkout main and build
          git checkout origin/main -- index.bs
          bikeshed spec
          mv index.html main_index.html

          # Restore PR version
          git checkout $PR_REF -- index.bs
          mv pr_index.html index.html

      - name: Generate spec diff
        run: |
          # Install perl dependencies for htmldiff
          sudo apt-get update -qq && sudo apt-get install -y -qq cpanminus
          sudo cpanm --notest Algorithm::Diff

          # Download htmldiff.pl from W3C
          wget -q https://raw.githubusercontent.com/w3c/htmldiff-ui/main/htmldiff.pl
          chmod +x htmldiff.pl

          # Generate diff (3 args: old new output)
          ./htmldiff.pl main_index.html index.html diff.html

          echo "Diff generated successfully"

      - name: Prepare artifacts for upload
        id: prepare
        run: |
          # Create dist directory and copy the built specification
          mkdir -p dist
          cp index.html dist/
          cp diff.html dist/

          # Get commit info for the artifact
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

          echo "Specification built successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: av2-isobmff-spec-preview
          path: ./dist
          retention-days: 30

      - name: Create or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = '${{ steps.prepare.outputs.commit_sha }}';
            const runId = context.runId;
            const repo = context.repo;
            const prNumber = context.issue.number;

            // Build the comment body
            const commentBody = `## 📄 Specification Preview

            The AV2 ISOBMFF specification has been built for this PR!

            ### 🔗 Quick Links
            - **[Download Build Artifact](https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId})**

            ### 📦 What's included:
            - \`index.html\` - The compiled specification
            - \`diff.html\` - Diff view comparing to main branch

            ### 📥 How to preview:
            1. Click the "Download Build Artifact" link above
            2. Download the \`av2-isobmff-spec-preview\` artifact
            3. Extract the ZIP file
            4. Open \`index.html\` to view the specification
            5. Open \`diff.html\` to see changes from main

            ---
            *Built from commit ${commitSha} • Updated: ${new Date().toUTCString()}*`;

            // Find existing comment from this bot
            const { data: comments } = await github.rest.issues.listComments({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📄 Specification Preview')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: repo.owner,
                repo: repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              console.log('Updated existing PR comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
              console.log('Created new PR comment');
            }
