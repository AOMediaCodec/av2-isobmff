name: Check PR

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build specification
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for diff support

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/specbuild/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r tools/specbuild/requirements.txt

      - name: Install Node dependencies
        run: cd tools/specbuild && npm install --registry https://registry.npmjs.org

      - name: Verify node_modules installed
        run: |
          ls tools/specbuild/node_modules/@mpeggroup/mpeg-sdl-parser/package.json
          ls tools/specbuild/node_modules/puppeteer-core/package.json

      - name: Install WeasyPrint system libraries
        run: sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Build specification with diff
        env:
          # Allow git to clone the repo using the built-in token
          GIT_CONFIG_GLOBAL: /tmp/gitconfig
        run: |
          git config --global credential.helper '!f() { echo "username=x-access-token"; echo "password=${{ secrets.GITHUB_TOKEN }}"; }; f'
          python tools/specbuild/compile.py \
            --profile publication \
            --toc-leaders table \
            --check-sdl-syntax \
            --diff --diff_viewer \
            --diff_sha origin/${{ github.base_ref }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: av2-isobmff-spec-pr-${{ github.event.pull_request.number }}
          path: av2-isobmff_Spec/
          retention-days: 30

      - name: Post preview link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = context.sha.substring(0, 8);
            const runId = context.runId;
            const repo = context.repo;
            const prNumber = context.issue.number;

            const commentBody = `## 📄 Specification Preview

            The AV2 ISOBMFF specification has been built for this PR.

            ### 🔗 Quick Links
            - **[Download Build Artifact](https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId})**

            ### 📦 What's included
            - \`index.html\` — Compiled specification (HTML)
            - \`av2-isobmff_Spec.pdf\` — PDF output
            - \`diff.html\` — Changes vs \`${context.payload.pull_request.base.ref}\`
            - \`diff_viewer.html\` — Three-pane diff viewer

            ### 📥 How to preview
            1. Click the "Download Build Artifact" link above
            2. Download the artifact zip
            3. Extract and open \`index.html\` or \`diff_viewer.html\` in your browser

            ---
            *Built from commit ${commitSha} · Updated: ${new Date().toUTCString()}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('📄 Specification Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: repo.owner,
                repo: repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }
